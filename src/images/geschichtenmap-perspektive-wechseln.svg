  <text x="358" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">in the park</text>
  <rect x="10" y="116" width="224" height="96" rx="6" fill="#fff" stroke="#d35400" stroke-width="3"/>
  <rect x="10" y="116" width="224" height="28" rx="6" fill="#d35400"/>
