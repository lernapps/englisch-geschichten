<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 222" role="img">
  <title>Die story map zur Geschichte vom roten Hut, diesmal aus der Sicht des Mädchens: Brille am Feld who mit dem Hinweis Sicht von a girl, where im Park, when am Samstagmorgen, what das Mädchen sieht den Hut in den Teich fliegen</title>
  <rect width="480" height="222" fill="#f4efe2"/>
  <rect x="10" y="10" width="224" height="96" rx="6" fill="#fff" stroke="#2c6fd8" stroke-width="3"/>
