  <line x1="26" y1="54" x2="354" y2="54" stroke="#999" stroke-width="1"/>
  <text x="26" y="86" font-family="sans-serif" font-size="17" fill="#222" xml:space="preserve"><tspan font-weight="bold" font-style="normal">Ellie</tspan><tspan font-weight="normal" font-style="normal">: Look! A fox!</tspan></text>
