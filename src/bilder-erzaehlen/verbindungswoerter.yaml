# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Wegweiser: first, then, suddenly, after that, finally"
description: "Mr Hill hängt fünf Wegweiser an den Geschichtenberg. Du lernst, mit ihnen Sätze in einer Erzählung zu ordnen."
competencies: [verbindungswoerter-erzaehlen]
scope: Die Seite führt die fünf Wegweiser first, then, suddenly, after that und finally ein. Sie stehen am Satzanfang und zeigen, wo am Geschichtenberg die Geschichte gerade ist. First gehört zum beginning, then zum build-up, suddenly kurz vor den climax, after that nach den climax und finally zum ending. Then und after that sind in der Mitte fast gleich. Erzählt wird im simple past. Nicht hier, weil es spätere Seiten sind. Ein Bild beschreiben, eine Bildergeschichte schreiben und eine ganze Geschichte planen. Die Zeitformen selbst.
blocks:
  - type: section
    id: einstieg
    title: Fünf Wegweiser für den Geschichtenberg
    blocks:
      - type: figure
        image: images/szene-verbindungswoerter.svg
        alt: "In der Geschichtenecke hängen an der Wand der Geschichtenberg und die story map. Darunter liegen in einer Reihe fünf Schilder mit den Wörtern after that, first, finally, then und suddenly. Davor stehen Sophie, Peter, Ellie und Amir, rechts steht Mr Hill. Sophie sagt in einer Sprechblase: „Five signs!“"
        caption: "Von links: Sophie (Zöpfe), Peter (gelbe Jacke), Ellie (roter Pferdeschwanz), Amir (Brille) und Mr Hill (graue Haare). Unter dem Geschichtenberg und der story map liegen die fünf Wegweiser."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Es ist Dienstag in der Geschichtenwoche. Mr Hill hat fünf Schilder mitgebracht, die **Wegweiser**. Sie zeigen, in welcher Reihenfolge etwas passiert. Peter hat zwei Sätze mit Wegweisern aufgeschrieben, aber nicht in der richtigen Reihenfolge: „Then we went home.“ und „First we played football.“"
      - type: single-choice
        id: verbindung-start
        text: Welcher Satz steht am Anfang der Geschichte?
        options:
          - text: First we played football
            correct: true
            info: First zeigt den Anfang der Geschichte.
          - text: Then we went home
            correct: false
            info: Then kommt erst nach einem ersten Ereignis.
          - text: Das lässt sich nicht sagen
            correct: false
            info: Doch, die Wegweiser zeigen die Reihenfolge.
        explanation: Ein Wegweiser am Satzanfang zeigt, wo die Geschichte gerade ist.
        links:
          - title: Lernlandkarte Englisch · Verbindungswörter beim Erzählen
            url: https://lernapps.net/apps/map/englisch/c/verbindungswoerter-erzaehlen/
      - type: text
        text: "**Das kannst du danach:** Du setzt die richtigen Wegweiser in eine Geschichte und ordnest so Sätze in der Reihenfolge, in der sie passieren."
  - type: section
    id: neu
    title: Welcher Wegweiser steht wo am Berg?
    blocks:
      - type: text
        text: "Sophie und Ellie erzählen von einem Wintertag. Lies mit: „First Sophie and Ellie built a snowman in the garden. Then they put a hat on it. Suddenly a dog ran into the snowman. After that the girls laughed. Finally they built a new snowman.“"
      - type: figure
        image: images/geschichtenberg-verbindungswoerter.svg
        alt: "Ein Berg mit vier Fähnchen: 1 beginning, 2 build-up, 3 climax am Gipfel, 4 ending. Dazu stehen fünf Schilder auf dem Berg. First am Fuß ganz links, then weiter oben links, suddenly kurz vor dem Gipfel, after that auf der rechten Seite und finally ganz rechts unten."
        caption: "Der Geschichtenberg mit fünf Wegweisern. Sie stehen in der Reihenfolge der Geschichte."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Ein Wegweiser steht am Satzanfang und zeigt, wo du am Berg bist.** First gehört zum beginning, then zum build-up und kann öfter vorkommen. Suddenly steht kurz vor dem climax, wenn etwas Unerwartetes passiert. After that steht nach dem climax. Finally gehört zum ending. Then und after that sind fast gleich, beide passen in die Mitte. Nicht jeder Satz braucht einen Wegweiser, wechsle ab. Erzählt wird im simple past.
  - type: section
    id: uebung
    title: Ordne die Sätze mit den Wegweisern
    blocks:
      - type: matching
        id: verbindung-berg
        text: Ordne jedem Wegweiser seinen Platz am Geschichtenberg zu.
        pairs:
          - left: first
            right: Hier fängt die Geschichte an
          - left: then
            right: Hier baut sich etwas auf
          - left: suddenly
            right: Hier passiert kurz vor dem Gipfel etwas Unerwartetes
          - left: after that
            right: Hier geht es nach dem Gipfel weiter
          - left: finally
            right: Hier endet die Geschichte
        explanation: Die Wegweiser folgen dem Weg über den Berg.
        links:
          - title: Lernlandkarte Englisch · Verbindungswörter beim Erzählen
            url: https://lernapps.net/apps/map/englisch/c/verbindungswoerter-erzaehlen/
      - type: language-task
        id: verbindung-waehlen
        languages: { source: de, target: en }
        mode: choice
        task: Wähle den Wegweiser, der zum deutschen Satz passt.
        items:
          - source: Zuerst packte Amir seine Tasche.
            target: "[First] Amir packed his bag."
            distractors: [[Then, Finally]]
          - source: Plötzlich fiel die Tasche auf den Boden.
            target: "[Suddenly] the bag fell on the floor."
            distractors: [[First, After that]]
          - source: Danach lachten beide.
            target: "[After that|Then] both laughed."
            distractors: [[First, Suddenly]]
          - source: Zum Schluss gingen sie nach Hause.
            target: "[Finally] they went home."
            distractors: [[First, Suddenly]]
        hint: Denke an den Weg über den Berg, vom Fuß zum Ende.
      - type: ordering
        id: verbindung-ordnen
        text: Ordne die Sätze in der Reihenfolge, in der Ellie etwas erlebt.
        items:
          - First Ellie went to the library.
          - Then she looked for a book about horses.
          - Suddenly all the lights went out.
          - After that she sat on the floor and waited.
          - Finally the lights came on again.
        explanation: Die Wegweiser zeigen die Reihenfolge, suddenly steht vor dem climax.
        links:
          - title: Lernlandkarte Englisch · Verbindungswörter beim Erzählen
            url: https://lernapps.net/apps/map/englisch/c/verbindungswoerter-erzaehlen/
      - type: language-task
        id: verbindung-schreiben
        languages: { source: de, target: en }
        task: Schreibe jeden Satz im simple past mit dem Wegweiser vom Anfang des Cues.
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - cue: Suddenly · Peter · drop · bag
            target: Suddenly Peter dropped (his|the) bag.
            mistakes:
              - answer: Suddenly Peter drops his bag.
                message: Erzählt wird im simple past, also dropped.
              - answer: Peter dropped his bag.
                message: Der Cue verlangt den Wegweiser suddenly am Satzanfang.
          - cue: Finally · Amir · find · phone
            target: Finally Amir found (his|the) phone.
            mistakes:
              - answer: Finally Amir finds his phone.
                message: Erzählt wird im simple past, also found.
              - answer: Finally Amir finded his phone.
                message: Find ist unregelmäßig, die Form heißt found.
          - cue: After that · the girls · walk · home
            target: (After that|Then) the girls walked home.
            mistakes:
              - answer: (After that|Then) the girls walk home.
                message: Erzählt wird im simple past, also walked.
              - answer: (After that|Then) the girls walked to home.
                message: Vor home steht kein to.
      - type: language-task
        id: verbindung-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: first-amir-opened-the-window.mp3
            target: First Amir opened the window.
          - audio: suddenly-the-bus-stopped-near-sophie.mp3
            target: Suddenly the bus stopped near Sophie.
          - audio: finally-the-children-ate-their-dinner.mp3
            target: Finally the children ate their dinner.
  - type: section
    id: anwenden
    title: Selbst sagen und eine Erzählung schreiben
    blocks:
      - type: speaking-task
        id: verbindung-nachsprechen
        language: en
        items:
          - audio: what-happens-first-peter.mp3
            text: What happens first, Peter?
          - audio: what-happens-after-that-amir.mp3
            text: What happens after that, Amir?
          - audio: then-what-happens-ellie.mp3
            text: Then what happens, Ellie?
        hint: Hör zu. Sprich dann langsam nach.
      - type: open-task
        id: verbindung-schreiben-frei
        task: "Schreibe vier bis fünf Sätze im simple past über einen Ausflug oder über deinen Weg zur Schule. Benutze first, finally und mindestens zwei weitere Wegweiser."
        points:
          - text: First steht am Anfang und finally am Schluss.
            source: /bilder-erzaehlen/verbindungswoerter/#neu
          - text: Suddenly steht kurz vor dem Höhepunkt, nicht am Anfang.
            source: /bilder-erzaehlen/verbindungswoerter/#neu
          - text: Mindestens drei verschiedene Wegweiser, nicht jeder Satz mit demselben.
            kind: form
          - text: Alle Sätze stehen im simple past.
            kind: form
        solution: |
          First Peter and Amir rode their bikes to the lake.
          Then they sat under a big tree.
          Suddenly it began to rain.
          After that they ran home.
          Finally they drank hot milk in the kitchen.
        hint: Die App bewertet nicht. Prüfe anhand der Punkte.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Am Mittwoch hängt Mr Hill ein neues Bild in die Geschichtenecke. Auf der nächsten Seite lernst du, ein Bild zu beschreiben und zu sagen, wo etwas ist."
