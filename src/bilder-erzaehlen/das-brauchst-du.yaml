# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für Bilder und Bildfolgen
description: "Am Dienstag erzählen die Kinder mit Bildern. Wiederhole, was du dafür brauchst: there is und there are, das present progressive und Präpositionen des Ortes."
recap: [englisch/there-is-are, englisch/present-progressive, englisch/praepositionen-ort]
scope: Die Seite wiederholt drei Bausteine, die das Kapitel braucht, ohne Übung. There is und there are sagen, was es an einem Ort gibt. Das present progressive (is oder are plus Verb mit -ing) sagt, was gerade passiert. Präpositionen des Ortes sagen, wo etwas ist. Nicht hier, weil es spätere Seiten sind. Die Wegweiser beim Erzählen, das Beschreiben eines Bildes und die Bildergeschichte im simple past.
blocks:
  - type: text
    text: Es ist Dienstag in der Geschichtenwoche. Heute erzählen die Kinder mit Bildern. Dafür brauchst du drei Bausteine, die du schon kennst. Prüfe in Gedanken, ob du sie noch kannst.
  - type: text
    text: |
      **[There is und there are](https://lernapps.net/apps/map/englisch/c/there-is-are/):** Ich kann mit „there is“ und „there are“ sagen, was es an einem Ort gibt. There is steht bei einem Gegenstand oder einer Person, there are bei mehreren.

      **[Present progressive](https://lernapps.net/apps/map/englisch/c/present-progressive/):** Ich kann im present progressive sagen, was gerade passiert (She is reading.). Du brauchst is oder are und das Verb mit -ing.

      **[Präpositionen des Ortes](https://lernapps.net/apps/map/englisch/c/praepositionen-ort/):** Ich kann mit Präpositionen wie in, on, under, next to und behind sagen, wo etwas ist. Dazu kommen at und between.
  - type: table
    caption: Klassenzimmer-Poster · Wiederholung
    header: [Baustein, Beispiel]
    rows:
      - [there is · there are, There is a bus. There are two buses.]
      - [is · are + -ing, The girl is running.]
      - [in · on · at, in the park · on the grass]
      - [under · next to, under the chair · next to the door]
      - [behind · between, behind the school · between the trees]
  - type: text
    text: Kannst du das? Dann geht es weiter mit den Wegweisern am Geschichtenberg.
