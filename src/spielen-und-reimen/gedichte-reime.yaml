# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Reime hören, finden und sprechen"
description: "Mr Hill schließt die Geschichtenwoche mit einem Reim ab. Du lernst, Reimwörter zu finden und kurze Verse laut zu sprechen."
competencies: [gedichte-reime]
scope: "Die Seite zeigt, wie man Reimwörter findet und kurze Verse vorträgt. Zwei Wörter reimen sich, wenn sie am Ende gleich klingen. Die Schreibung hilft oft, aber nicht immer. Die App prüft den Klang nicht: Reimpaare werden nach Schreibung und Muster zugeordnet, der Klang kommt über das Hören und Nachsprechen ganzer Verse. Das Klatschen des Rhythmus ist eine Anleitung, die App prüft es nicht. Nicht hier: Gedichte und Lieder untersuchen, Strophenformen und Reimschemata, die Lautschrift. Die App bewertet den eigenen Zweizeiler nicht."
blocks:
  - type: section
    id: einstieg
    title: Ein Reim zum Wochenende
    blocks:
      - type: figure
        image: images/szene-gedichte-reime.svg
        alt: "In der Geschichtenecke hängen an der Wand links ein Berg mit vier Fähnchen und rechts eine Tafel mit den vier Feldern who, where, when und what. Mr Hill steht rechts und sagt in einer Sprechblase: „Time to rhyme!“ Davor stehen Sophie, Peter, Ellie und Amir."
        caption: "Von links: Sophie (Zöpfe), Peter (gelbe Jacke), Ellie (roter Pferdeschwanz), Amir (Brille) und Mr Hill (graue Haare). An der Wand hängen der Geschichtenberg und die story map."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Es ist Freitag, die Geschichtenwoche ist fast vorbei. Mr Hill schließt sie mit einem **Reim** ab (englisch: rhyme). Zwei Wörter reimen sich, wenn sie am Ende gleich **klingen**. Mr Hill sagt das Wort star. Amir sucht ein Reimwort."
      - type: single-choice
        id: reime-start
        text: Welches Wort reimt sich auf star?
        options:
          - text: car
            correct: true
            info: Star und car klingen am Ende gleich.
          - text: start
            correct: false
            info: Es beginnt wie star, aber das Ende klingt anders.
          - text: sun
            correct: false
            info: Nur der Anfang ist ähnlich. Ein Reim hängt am Ende.
        explanation: Beim Reim zählt der Klang am Ende des Wortes.
        links:
          - title: Lernlandkarte Englisch · Gedichte und Reime
            url: https://lernapps.net/apps/map/englisch/c/gedichte-reime/
      - type: text
        text: "**Das kannst du danach:** Du findest Reimwörter, sprichst kurze Verse laut nach und schreibst selbst einen Zweizeiler."
      - type: text
        text: Diese Wörter sind neu auf dem Klassenzimmer-Poster.
      - type: table
        caption: Klassenzimmer-Poster · Neue Wörter
        header: [Wort, Bedeutung]
        rows:
          - [rhyme, Reim]
          - [verse, "Vers, hier eine Zeile eines Gedichts"]
          - [rhythm, Rhythmus]
  - type: section
    id: neu
    title: Reimwörter finden und Verse sprechen
    blocks:
      - type: text
        text: "Reimwörter findest du so: Nimm die Endung eines Wortes und setze andere Anfänge davor. Die Endung von pen ist -en. Setzt du t davor, wird daraus ten, mit h wird es hen. Meistens reimen sich Wörter mit gleicher Endung."
      - type: figure
        image: images/reime-gedichte-reime.svg
        alt: "Vier Karten mit je einem Wortpaar. Pen und ten sowie hand und sand haben die gleiche Endung und reimen sich. One und run reimen sich trotz anderer Schreibung. Move und love haben die gleiche Schreibung und reimen sich nicht."
        caption: "Vier Wortpaare vom Klassenzimmer-Poster. Fett steht der Teil, den du vergleichst: die Endung, bei one und run das ganze Wort."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Verse sprichst du laut. Hör zuerst zu und sprich dann ganze Verse nach, nicht einzelne Wörter. Klatsche dabei den **Rhythmus**: bei jeder betonten Silbe einmal. Haben zwei Zeilen gleich viele betonte Silben, passt der Rhythmus. Das hörst du selbst, die App prüft es nicht."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Reime richten sich nach dem Klang, nicht nach den Buchstaben.** Die Schreibung hilft oft: Wörter mit gleicher Endung reimen sich meistens. Es gibt Ausnahmen. One und run reimen sich, obwohl sie anders geschrieben sind. Move und love sehen am Ende gleich aus, aber sie reimen sich nicht. Sprich ein Paar darum immer laut.
  - type: section
    id: uebung
    title: Reimpaare finden und Verse ordnen
    blocks:
      - type: matching
        id: reime-paare
        text: Welche Wörter reimen sich? Ordne die Paare zu und achte auf das Ende.
        pairs:
          - left: cat
            right: hat
          - left: light
            right: night
          - left: day
            right: play
          - left: boat
            right: coat
        explanation: Die Wörter haben die gleiche Endung und klingen am Ende gleich.
        links:
          - title: Lernlandkarte Englisch · Gedichte und Reime
            url: https://lernapps.net/apps/map/englisch/c/gedichte-reime/
      - type: single-choice
        id: reime-zeile
        text: "Lies den Vers: „I see a bird up in the tree, and it is singing just for ...“ Welches Wort reimt sich auf tree und passt ans Ende?"
        options:
          - text: me
            correct: true
            info: Tree und me klingen am Ende gleich.
          - text: you
            correct: false
            info: Der Sinn passt, aber you reimt sich nicht auf tree.
          - text: all
            correct: false
            info: Der Sinn passt, aber all reimt sich nicht auf tree.
        explanation: Ein Reimwort passt zum Sinn und klingt am Ende wie das Wort der ersten Zeile.
        links:
          - title: Lernlandkarte Englisch · Gedichte und Reime
            url: https://lernapps.net/apps/map/englisch/c/gedichte-reime/
      - type: single-choice
        id: reime-klang
        text: Welches Paar reimt sich im Klang?
        hint: Sprich beide Wörter laut.
        options:
          - text: food – good
            correct: false
            info: Die Schreibung ist am Ende gleich, aber man spricht die Wörter verschieden.
          - text: bed – head
            correct: true
            info: Die Schreibung ist anders, aber der Klang am Ende ist gleich.
          - text: now – know
            correct: false
            info: Sie sehen fast gleich aus, klingen am Ende aber verschieden.
        explanation: Reime richten sich nach dem Klang. Die Buchstaben sagen es nicht immer.
        links:
          - title: Lernlandkarte Englisch · Gedichte und Reime
            url: https://lernapps.net/apps/map/englisch/c/gedichte-reime/
      - type: ordering
        id: reime-verse
        text: "Ordne die vier Zeilen zu einem Gedicht. Zwei Paare reimen sich: wall und small, flew und too."
        items:
          - "Two little birds sat on the school wall,"
          - "one was big and one was small."
          - "The big one sang, the small one flew,"
          - "and then the big one followed too."
        explanation: Die Vögel sitzen zuerst auf der Mauer, einer groß, einer klein. Dann singt der große, der kleine fliegt weg und der große folgt.
        links:
          - title: Lernlandkarte Englisch · Gedichte und Reime
            url: https://lernapps.net/apps/map/englisch/c/gedichte-reime/
      - type: language-task
        id: reime-luecke
        languages: { source: de, target: en }
        mode: gap
        task: "Ergänze das Reimwort am Ende. Es reimt sich auf das Wort im Hinweis."
        form: { case: hint, punctuation: ok }
        items:
          - cue: Rhymes with book.
            target: "I read my book and take a [look]."
          - cue: Rhymes with down.
            target: "The rain falls down on the [town]."
          - cue: Rhymes with snowing.
            target: "It is cold and snowing, where are we [going]?"
        hint: Setze andere Anfangsbuchstaben vor die Endung des Wortes im Hinweis. Auch mehrere Buchstaben können sich ändern.
      - type: language-task
        id: reime-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe den ganzen Vers. Achte auf die Reimwörter, in jedem Vers reimen sich zwei Wörter.
        form: { case: hint, punctuation: ok }
        items:
          - audio: i-like-to-see-the-flowers-after-the-showers.mp3
            target: I like to see the flowers after the showers.
          - audio: read-a-little-letter-and-you-will-feel-better.mp3
            target: Read a little letter and you will feel better.
          - audio: my-brother-and-my-mother-help-each-other.mp3
            target: My brother and my mother help each other.
  - type: section
    id: anwenden
    title: Verse sprechen und einen Zweizeiler schreiben
    blocks:
      - type: speaking-task
        id: reime-nachsprechen
        language: en
        items:
          - audio: let-us-sing-together-in-the-lovely-weather.mp3
            text: Let us sing together in the lovely weather.
          - audio: the-monkey-is-funny-and-it-likes-honey.mp3
            text: The monkey is funny and it likes honey.
          - audio: the-rain-is-falling-and-the-birds-are-calling.mp3
            text: "The rain is falling, and the birds are calling."
        hint: Hör zu. Sprich dann den ganzen Vers langsam nach und klatsche den Rhythmus.
      - type: open-task
        id: reime-schreiben
        task: "Schreibe einen eigenen Zweizeiler auf Englisch. Das Thema ist ein Tier oder das Wetter. Sprich ihn dann laut und klatsche den Rhythmus."
        points:
          - text: Es sind zwei Zeilen.
            kind: form
          - text: Die letzten Wörter der beiden Zeilen klingen am Ende gleich.
            source: /spielen-und-reimen/gedichte-reime/#neu
          - text: Die Zeilen sind ungefähr gleich lang. Beim Klatschen passt der Rhythmus.
            source: /spielen-und-reimen/gedichte-reime/#neu
          - text: Du hast beide Zeilen laut gesprochen und die Reimwörter gehört.
            source: /spielen-und-reimen/gedichte-reime/#neu
        solution: |
          The wind is strong,
          the night is long.
        hint: Die App bewertet nicht. Prüfe anhand der Punkte.
  - type: section
    id: weiter
    title: Rückblick auf das Kapitel und die Woche
    blocks:
      - type: text
        text: |
          **Das Kapitel:** Du schreibst einen Dialog in Skriptform, mit Sprecher, Doppelpunkt und kurzen Sätzen. Du findest Reimwörter und sprichst Verse. Reime richten sich nach dem Klang, die Schreibung hilft oft.
      - type: text
        text: |
          **Die Woche im Rückblick:**

          - Montag: Du liest und füllst die story map.
          - Dienstag und Mittwoch: Du erzählst Bilder.
          - Donnerstag: Du schreibst eine eigene Geschichte.
          - Freitag: Du spielst eine Szene und sprichst einen Reim.

          Die Geschichtenwoche ist geschafft.
