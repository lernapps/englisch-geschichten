format: 2
subject: englisch
title: Geschichten lesen, erzählen und weiterschreiben
intro: In der Millbrook School hat Mr Hill eine Geschichtenwoche. In der Geschichtenecke hängen ein Geschichtenberg und eine story map. Sophie (11, aus Deutschland), Ellie (11), ihr Bruder Peter (9) und Amir (11) lesen Geschichten, erzählen sie nach, beschreiben Bilder, schreiben eigene Geschichten und spielen am Freitag eine Szene. Du lernst, einer Geschichte zu entnehmen, wer, wo, wann und was, sie kurz wiederzugeben und selbst Geschichten zu erzählen, zu spielen und weiterzuschreiben.
languages: [de]
scope:
  text: Die App erklärt für Kinder im ersten und zweiten Lernjahr, wie man englische Geschichten liest, wiedergibt und schreibt. Zwei Bilder tragen sie. Die story map hat vier Felder (who, where, when, what). Der Geschichtenberg hat vier Stationen (beginning, build-up, climax, ending). Gelernt werden Figuren, Ort, Zeit und Handlung herausfinden, zusammenfassen, nacherzählen, Verbindungswörter beim Erzählen (first, then, after that, suddenly, finally), Bilder und Bildfolgen beschreiben, eine Geschichte schreiben und fortsetzen, ein Tagebuch schreiben, einen Dialog schreiben und Reime vortragen. Die Geschichten sind eigene kurze Texte im simple past mit den Figuren Sophie, Ellie, Peter und Amir. Offene Aufgaben haben Punkte und eine Musterlösung. Die App bewertet den Text nicht, die Kinder prüfen ihn an den Punkten.
  out:
    - Die Zeitformen selbst (steht im Explainer „Zeiten auf dem Zeitstrahl“)
    - Kurzgeschichten, Gedichte, Dramen und Filme untersuchen
    - Sachtexte, Bericht und Artikel
    - Eine Geschichte aus der Sicht einer anderen Figur erzählen und Stimmung durch Ort und Sprache (später)
    - Bewertung der Aussprache und der freien Texte durch die App
chapters: [was-passiert, bilder-erzaehlen, selbst-erzaehlen, spielen-und-reimen]
