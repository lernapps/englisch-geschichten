# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Zusammenfassen: nur das Wichtigste"
description: "Mr Hill gibt jedem Kind einen Zettel. Du lernst, das Wichtigste einer Geschichte in wenigen Sätzen zusammenzufassen."
competencies: [zusammenfassung]
scope: Die Seite zeigt, wie man das Wichtigste einer kurzen Geschichte in wenigen Sätzen zusammenfasst. In die Zusammenfassung kommen nur die Haupt-Ereignisse der vier Stationen des Geschichtenbergs. Einzelheiten, eine Meinung und Sätze, die man wörtlich übernimmt, bleiben draußen, und es fehlt keine Station. Die Sätze stehen im simple past, wie die Geschichte. Nicht hier, weil es spätere Seiten sind. Nacherzählen in eigenen Worten Station für Station, Verbindungswörter beim Erzählen und eigene Geschichten schreiben. Die Zusammenfassung von Sachtexten.
blocks:
  - type: section
    id: einstieg
    title: Ein Zettel mit drei Sätzen
    blocks:
      - type: figure
        image: images/szene-zusammenfassung.svg
        alt: "Im Klassenzimmer sitzen Sophie, Peter, Ellie und Amir. Jedes Kind hat einen Zettel vor sich. Mr Hill steht rechts und sagt in einer Sprechblase: „Tell the story in three sentences.“"
        caption: "Von links: Sophie (Zöpfe), Peter (gelbe Jacke), Ellie (roter Pferdeschwanz), Amir (Brille) und Mr Hill (graue Haare). Jedes Kind hat den Zettel von Mr Hill."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Mr Hill gibt jedem Kind einen **Zettel**. Darauf steht: „Tell the story in three sentences.“ Ellie flüstert: „Nur drei Sätze?“ Mr Hill lächelt. In einer Geschichte steht viel, aber du schreibst nur das Wichtige auf. Zuerst liest Sophie eine kurze Geschichte."
      - type: multiple-choice
        id: zusammen-start
        text: "Sophie liest: „On Sunday Ellie's grey cat Smoky climbed up the apple tree. It could not come down. Ellie stood on a chair and carried Smoky down. Then Mrs Parker made hot chocolate for everybody.“ Welche Sätze gehören in eine kurze Zusammenfassung? Wähle alle richtigen."
        options:
          - text: Smoky climbed up the apple tree
            correct: true
            info: Das ist ein wichtiges Ereignis am Anfang.
          - text: Smoky could not come down
            correct: true
            info: Hier beginnt das Problem.
          - text: Ellie carried Smoky down
            correct: true
            info: So löst sich das Problem.
          - text: Smoky is a grey cat
            correct: false
            info: Das ist eine Einzelheit, kein Ereignis.
          - text: Mrs Parker made hot chocolate
            correct: false
            info: Das ist eine Nebensache.
        explanation: Wichtig ist, was die Geschichte weiterbringt.
        links:
          - title: Lernlandkarte Englisch · Zusammenfassen
            url: https://lernapps.net/apps/map/englisch/c/zusammenfassung/
      - type: text
        text: "**Das kannst du danach:** Du findest in einer Geschichte das Wichtigste und schreibst es in wenigen Sätzen auf. Du lässt Einzelheiten und deine Meinung weg."
      - type: text
        text: Diese Wörter sind neu auf dem Klassenzimmer-Poster.
      - type: table
        caption: Klassenzimmer-Poster · Neue Wörter
        header: [Wort, Bedeutung]
        rows:
          - [summary, Zusammenfassung]
          - [detail, Einzelheit]
          - [goldfish, Goldfisch]
          - [carry, tragen]
  - type: section
    id: neu
    title: Nur das, was am Geschichtenberg hängt
    blocks:
      - type: text
        text: "Mr Hill liest eine andere Geschichte vor: „In January it snowed. Sophie and Amir made a big snowman with a carrot nose in the school yard. Their hands were cold, but they laughed. Suddenly a brown dog ran into the snowman and it fell down. Sophie was sad, but Amir had an idea. They made a new snowman and gave it a red scarf.“"
      - type: figure
        image: images/geschichtenberg-zusammenfassung.svg
        alt: "Ein Berg mit vier Fähnchen: 1 beginning, 2 build-up, 3 climax am Gipfel, 4 ending. Darunter stehen vier Stichwörter: make snowman, dog comes, snowman falls, make new one. Drei Kästchen mit gestrichelten Rändern und kleinen Pfeilen nach unten fallen vom Berg: cold hands, red scarf, carrot nose."
        caption: "Der Geschichtenberg zur Geschichte vom Schneemann. An den Fähnchen hängen die Haupt-Ereignisse. Die Kästchen mit gestrichelten Rändern sind Nebensachen: Sie fallen herunter."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Eine **Zusammenfassung** (englisch: summary) ist der Geschichtenberg in Sätzen. Du nimmst nur die Haupt-Ereignisse der vier Stationen. Alles andere fällt vom Berg: Einzelheiten wie Farben oder kalte Hände, deine Meinung und Sätze, die du Wort für Wort aus der Geschichte nimmst."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Eine Zusammenfassung ist kurz und hat nur die Haupt-Ereignisse.** Du schreibst sie in eigenen Worten im simple past, wie die Geschichte. Es fehlt keine Station, es steht keine Meinung darin (nicht „It was great.“) und nicht nur der Anfang. Drei bis vier Sätze reichen.
  - type: section
    id: uebung
    title: Finde und schreibe das Wichtigste
    blocks:
      - type: single-choice
        id: zusammen-beste
        text: "Peter erzählt: „One morning Peter's goldfish Goldie was not in her bowl. Peter looked under the table and behind the sofa. Then he went to the kitchen. Mrs Parker was there. She had cleaned the bowl, and Goldie was in a blue cup by the window. Peter put Goldie back in the clean bowl.“ Welche Zusammenfassung ist die beste?"
        options:
          - text: "Peter's goldfish was not in her bowl. Peter looked under the table and behind the sofa, then he went to the kitchen, where Mrs Parker had a blue cup by the window, and he put Goldie back."
            correct: false
            info: Zu lang, hier stehen viele Einzelheiten.
          - text: "Peter's goldfish was in a cup. It is a funny story and I like Peter."
            correct: false
            info: Das ist eine Meinung, und der Anfang fehlt.
          - text: "Peter's goldfish was not in her bowl. Peter looked under the table and behind the sofa."
            correct: false
            info: Das ist nur der Anfang, das Ende fehlt.
          - text: "Goldie was not in her bowl. Peter found her in a cup. He put her back in the clean bowl."
            correct: true
            info: Alle Stationen, kurz und ohne Meinung.
        explanation: Kurz und mit allen Stationen.
        links:
          - title: Lernlandkarte Englisch · Zusammenfassen
            url: https://lernapps.net/apps/map/englisch/c/zusammenfassung/
      - type: matching
        id: zusammen-zuordnen
        text: "Ordne die Sätze aus der Geschichte vom Goldfisch zu."
        pairs:
          - left: Peter found Goldie in a cup.
            right: Ereignis, kommt hinein
          - left: The cup was blue.
            right: Einzelheit, bleibt draußen
          - left: It is a funny story.
            right: Meinung, bleibt draußen
        explanation: Nur Ereignisse kommen in die Zusammenfassung.
        links:
          - title: Lernlandkarte Englisch · Zusammenfassen
            url: https://lernapps.net/apps/map/englisch/c/zusammenfassung/
      - type: ordering
        id: zusammen-ordnen
        text: "Das ist die Zusammenfassung der Geschichte von Smoky. Ordne die drei Sätze in der Reihenfolge der Geschichte."
        items:
          - Ellie's cat climbed up a tree.
          - It could not get down.
          - Ellie got it down.
        explanation: Erst die Katze, dann das Problem, dann die Lösung.
        links:
          - title: Lernlandkarte Englisch · Zusammenfassen
            url: https://lernapps.net/apps/map/englisch/c/zusammenfassung/
      - type: language-task
        id: zusammen-kuerzen
        languages: { source: de, target: en }
        task: "Lies: „On Thursday afternoon, in the cold park, Amir lost his new blue football. After an hour a man with a small dog found it behind a big tree.“ Schreibe die zwei Haupt-Ereignisse als kurze Sätze."
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - cue: Amir · lose · football
            target: Amir lost (his |the |a |his new |the new |a new )football( in the park|).
            mistakes:
              - answer: Amir lose his football.
                message: Das Ereignis ist vorbei, das Verb steht im simple past.
              - answer: Amir losed his football.
                message: Lose ist unregelmäßig, die Form heißt lost.
              - answer: Amir lost football.
                message: Vor football fehlt his, the oder a.
          - cue: man · find · football · tree
            target: (A|The) man found (the |his |a )(football|ball)( behind a tree| behind the tree|).
            mistakes:
              - answer: A man find the football.
                message: Das Ereignis ist vorbei, das Verb steht im simple past.
              - answer: A man finded the football.
                message: Find ist unregelmäßig, die Form heißt found.
              - answer: A man found football.
                message: Vor football fehlt the oder a.
      - type: language-task
        id: zusammen-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: ellie-wrote-only-the-big-events.mp3
            target: Ellie wrote only the big events.
          - audio: sophie-left-out-the-colours.mp3
            target: Sophie left out the colours.
          - audio: peter-did-not-know-the-end-of-the-story.mp3
            target: Peter did not know the end of the story.
  - type: section
    id: anwenden
    title: Selbst sagen und zusammenfassen
    blocks:
      - type: speaking-task
        id: zusammen-nachsprechen
        language: en
        items:
          - audio: who-helped-in-the-story.mp3
            text: Who helped in the story?
          - audio: what-was-the-problem.mp3
            text: What was the problem?
          - audio: how-did-the-story-finish.mp3
            text: How did the story finish?
        hint: Hör zu. Sprich dann langsam nach.
      - type: open-task
        id: zusammen-schreiben
        task: "Denke an eine Geschichte, die du kennst, zum Beispiel ein Märchen, einen Film oder ein Buch. Fasse sie auf Englisch in drei Sätzen zusammen."
        points:
          - text: Es sind drei Sätze mit den Haupt-Ereignissen von Anfang, Problem und Ende.
            source: /was-passiert/zusammenfassung/#neu
          - text: Es gibt keine Einzelheiten und keine Meinung.
            source: /was-passiert/zusammenfassung/#neu
          - text: Die Sätze stehen im simple past und sind in eigenen Worten geschrieben.
            kind: form
        solution: |
          A boy lost his kite in the park.
          A girl found it in a tree.
          They flew the kite together.
        hint: Die App bewertet nicht. Prüfe anhand der Punkte.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Mr Hill sammelt die Zettel ein und liest ein paar vor. Die Kinder merken, dass drei Sätze reichen. Danach setzt sich Amir zu Ellie und Sophie. Auf der nächsten Seite erzählst du eine Geschichte in eigenen Worten nach, Station für Station."
