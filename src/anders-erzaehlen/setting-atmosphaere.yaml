# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Wo, wann und wie fühlt es sich an? Die Farbe am Feld where"
description: "Mr Hill erklärt die Farbe am Feld where. Du liest, wie Ellie abends durch den Park geht, und lernst, wie Ort, Zeit und Wörter eine Stimmung machen."
competencies: [setting-atmosphaere]
scope: Die Seite zeigt, dass eine Geschichte einen Ort (where) und eine Zeit (when) hat und dass die Wörter dazu eine Stimmung (mood) erzeugen. Die Farbe am Feld where der story map sagt, wie sich der Ort anfühlt. Die Stimmung entsteht durch Wörter für Wetter, Licht und Geräusche. Man zeigt sie mit solchen Wörtern, statt sie nur zu behaupten. Das Lesestück ist ein eigener Text im simple past. Offene Aufgaben haben Punkte und eine Musterlösung, die App bewertet den Text nicht. Die Sicht einer Figur steht auf der vorigen Seite. Die Analyse von Kurzgeschichten gehört nicht hierher.
blocks:
  - type: section
    id: einstieg
    title: Eine Farbe an der story map
    blocks:
      - type: figure
        image: images/szene-setting-atmosphaere.svg
        alt: "In der Geschichtenecke hängen der Geschichtenberg und die story map. Das Feld where hat eine graue Fläche, auf dem Feld who ist eine Brille gezeichnet. Rechts steht Mr Hill, links neben ihm stehen Sophie, Peter, Ellie und Amir. Eine Sprechblase fragt: „How does it feel?“"
        caption: "Donnerstag in der Geschichtenwoche. Von links: Sophie (Zöpfe), Peter (gelbe Jacke), Ellie (roter Pferdeschwanz), Amir (mit Brille) und Mr Hill (graue Haare). Die graue Fläche am Feld where ist die Stimmungsfarbe."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Donnerstag. Mr Hill zeigt auf die graue Fläche am Feld **where**. Sie sagt, wie sich der Ort anfühlt: die **Stimmung** (englisch: mood). Das Feld **when** sagt dazu, wann die Geschichte spielt."
      - type: single-choice
        id: ort-start
        text: "Welche zwei Felder der story map sagen, wo und wann eine Geschichte spielt?"
        options:
          - text: where und when
            correct: true
            info: Where ist der Ort, when die Zeit.
          - text: who und what
            correct: false
            info: Who sind die Figuren, what ist das Geschehen.
          - text: where und what
            correct: false
            info: What sagt, was passiert, nicht wann.
        explanation: Ort und Zeit stehen in where und when.
        links:
          - title: Lernlandkarte Englisch · Setting und Atmosphäre
            url: https://lernapps.net/apps/map/englisch/c/setting-atmosphaere/
      - type: text
        text: "**Das kannst du danach:** Du sagst, wo und wann eine Geschichte spielt, und findest die Wörter, die eine Stimmung machen. Du schreibst eine Szene mit anderer Stimmung neu."
  - type: section
    id: lesen
    title: Lies „The Park in November“
    blocks:
      - type: quote
        text: |
          **1** It was a Thursday in November, and the afternoon was already turning dark.

          **2** Ellie walked home through Millbrook Park.

          **3** The sky was grey and heavy, and a cold wind moved the bare trees.

          **4** There was nobody on the path.

          **5** The wet leaves made no sound under her shoes.

          **6** Far away a dog barked once, and then it was quiet again.

          **7** Ellie pulled her jacket tight and walked faster.
        origin: { author: eigener Text für diese App, work: The Park in November, year: 2026 }
        source: eigener Text
        licence: CC-BY-4.0
      - type: definition
        term: bare
        explanation: kahl, ohne Blätter
      - type: definition
        term: path
        explanation: der Weg
      - type: quote
        text: |
          **8** The street lamps came on, one by one, and their yellow light was weak.

          **9** Long shadows lay across the grass.

          **10** Behind her a branch cracked.

          **11** Ellie stopped and listened, but she heard only the wind.

          **12** “Don’t be silly,” she whispered to herself.

          **13** Her heart beat faster anyway.

          **14** At the end of the path she saw the lights of her street.
        origin: { author: eigener Text für diese App, work: The Park in November, year: 2026 }
        source: eigener Text
        licence: CC-BY-4.0
      - type: definition
        term: shadow
        explanation: der Schatten
      - type: definition
        term: branch
        explanation: der Ast
      - type: definition
        term: whisper
        explanation: flüstern
      - type: single-choice
        id: ort-gefuehl
        text: "Wie fühlt sich Ellie im Park?"
        options:
          - text: unruhig
            correct: true
            info: Ihr Herz schlägt schneller.
          - text: fröhlich
            correct: false
            info: Sie lächelt erst am Ende.
          - text: müde
            correct: false
            info: Sie geht schneller.
        explanation: Die Wörter zeigen Unruhe.
        links:
          - title: Lernlandkarte Englisch · Setting und Atmosphäre
            url: https://lernapps.net/apps/map/englisch/c/setting-atmosphaere/
      - type: quote
        text: |
          **15** The wind was still cold, but the way felt shorter now.

          **16** She smelled smoke from a chimney and heard a television somewhere.

          **17** When she opened the gate, the kitchen window was bright and warm.

          **18** Mrs Parker was cooking, and the whole house smelled of soup.

          **19** Ellie took a deep breath.

          **20** She smiled, and the dark park behind her felt very far away.
        origin: { author: eigener Text für diese App, work: The Park in November, year: 2026 }
        source: eigener Text
        licence: CC-BY-4.0
      - type: definition
        term: chimney
        explanation: der Schornstein
  - type: section
    id: neu
    title: Wie Wörter eine Stimmung machen
    blocks:
      - type: text
        text: "Eine Stimmung entsteht durch **Wörter für Wetter, Licht und Geräusche**. Man schreibt nicht nur „It was scary.“, man zeigt es. Die Farbe am Feld where hält die Stimmung fest. Hier eine andere Szene."
      - type: figure
        image: images/geschichtenmap-setting-atmosphaere.svg
        alt: "Eine story map mit vier Feldern. Who: Amir, Peter. Where: the beach auf gelber Fläche mit dem Wort „froh“. When: Sunday noon. What: they build a sandcastle."
        caption: "Eine Szene am Strand. Die gelbe Fläche am Feld where heißt: froh. Wörter wie „sunny“ und „laughed“ machen diese Stimmung."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Ort und Zeit nennen, Stimmung zeigen.** Wetter, Licht und Geräusche machen die Stimmung. Die Wörter müssen zur Stimmung passen.
  - type: section
    id: uebung
    title: Verstehen, belegen, urteilen und neu schreiben
    blocks:
      - type: text
        text: "**Stufe 1: Verstehen**"
      - type: single-choice
        id: ort-wo
        text: "Wo und wann spielt die Geschichte? Wähle die beste Angabe."
        options:
          - text: im Park, an einem Novembernachmittag
            correct: true
            info: Das steht in den Zeilen 1 und 2.
          - text: im Park, an einem Sommermorgen
            correct: false
            info: Es ist kalt und wird dunkel.
          - text: vor Ellies Haus, am Abend
            correct: false
            info: Das Haus kommt erst am Ende vor.
        explanation: Ort und Zeit stehen am Anfang.
        links:
          - title: Lernlandkarte Englisch · Setting und Atmosphäre
            url: https://lernapps.net/apps/map/englisch/c/setting-atmosphaere/
      - type: text
        text: "**Stufe 2: Belegen mit Zeilen**"
      - type: matching
        id: stimmung-woerter
        text: "Welche Art von Wörtern steckt in welcher Zeile? Ordne zu."
        pairs:
          - left: "Zeile 3: grey and heavy, cold wind"
            right: Wetter
          - left: "Zeile 6: a dog barked once, then quiet"
            right: Geräusche
          - left: "Zeile 8: yellow light was weak"
            right: Licht
        explanation: Wetter, Licht und Geräusche machen die Stimmung.
        links:
          - title: Lernlandkarte Englisch · Setting und Atmosphäre
            url: https://lernapps.net/apps/map/englisch/c/setting-atmosphaere/
      - type: multiple-choice
        id: stimmung-belege
        text: "Welche Zeilen machen die Stimmung unheimlich? Wähle alle richtigen."
        options:
          - text: Zeile 4
            correct: true
            info: Niemand ist auf dem Weg.
          - text: Zeile 10
            correct: true
            info: Ein Ast knackt hinter ihr.
          - text: Zeile 18
            correct: false
            info: Hier ist es warm und gemütlich.
          - text: Zeile 2
            correct: false
            info: Das nennt nur den Ort.
        explanation: Unheimlich machen Stille, Dunkelheit und Geräusche.
        links:
          - title: Lernlandkarte Englisch · Setting und Atmosphäre
            url: https://lernapps.net/apps/map/englisch/c/setting-atmosphaere/
      - type: text
        text: "**Stufe 3: Meinung**"
      - type: multiple-choice
        id: stimmung-meinung
        text: "Am Ende wird die Stimmung warm. Welche Wörter machen das für dich am besten? Wähle alle, die du überzeugend findest."
        options:
          - text: bright and warm
            correct: true
            info: Licht und Wärme sind das Gegenteil von Dunkelheit.
          - text: smelled of soup
            correct: true
            info: Ein Geruch macht es gemütlich.
          - text: she heard only the wind
            correct: false
            info: Das gehört noch zum unruhigen Teil.
        explanation: Warme Wörter ersetzen die kalten.
        links:
          - title: Lernlandkarte Englisch · Setting und Atmosphäre
            url: https://lernapps.net/apps/map/englisch/c/setting-atmosphaere/
      - type: text
        text: "**Stufe 4: Neu schreiben**"
      - type: language-task
        id: stimmung-sommer
        languages: { source: de, target: en }
        task: "Dieselbe Szene an einem Sommermorgen. Schreibe je einen Satz im simple past nach dem Hinweis."
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - cue: "the sky · be · blue · the sun · be · warm"
            target: (The sky was blue and the sun was warm.|The sky was blue and the sun was hot.)
            mistakes:
              - answer: The sky is blue and the sun is warm.
                message: Die Szene steht im simple past, also was.
              - answer: The sky was grey and the sun was warm.
                message: Grey passt zu einer trüben Stimmung, hier ist es froh.
          - cue: "the birds · sing · in the trees"
            target: (The birds sang in the trees.|The birds were singing in the trees.)
            mistakes:
              - answer: The birds sing in the trees.
                message: Die Szene steht im simple past, also sang.
              - answer: The birds singed in the trees.
                message: Sing ist unregelmäßig, die Form heißt sang.
      - type: language-task
        id: stimmung-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: a-cold-rain-fell-on-the-roof.mp3
            target: A cold rain fell on the roof.
          - audio: the-sea-was-calm-and-the-sky-was-clear.mp3
            target: The sea was calm and the sky was clear.
          - audio: everybody-laughed-in-the-sunshine.mp3
            target: Everybody laughed in the sunshine.
  - type: section
    id: anwenden
    title: Selbst sprechen und eine Szene neu schreiben
    blocks:
      - type: speaking-task
        id: stimmung-nachsprechen
        language: en
        items:
          - audio: is-it-a-happy-or-a-sad-scene.mp3
            text: Is it a happy or a sad scene?
          - audio: what-is-the-mood-of-this-scene.mp3
            text: What is the mood of this scene?
          - audio: which-words-make-the-mood.mp3
            text: Which words make the mood?
        hint: Hör dir den Satz zuerst an. Sprich ihn dann langsam nach.
      - type: open-task
        id: stimmung-schreiben
        task: "Schreibe die Szene „Ellie geht durch den Park“ an einem Sommermorgen neu. Schreibe vier bis fünf Sätze im simple past. Nenne Ort und Zeit und benutze Wörter für Wetter, Licht und Geräusche, damit die Stimmung froh wird."
        points:
          - text: Ort und Zeit stehen im Text, zum Beispiel der Park und ein Sommermorgen.
            source: /anders-erzaehlen/setting-atmosphaere/#einstieg
          - text: Wörter für Wetter, Licht oder Geräusche zeigen die Stimmung.
            source: /anders-erzaehlen/setting-atmosphaere/#neu
          - text: Die Wörter passen zur frohen Stimmung, es steht nichts Düsteres darin.
            kind: form
          - text: Die Zeitform ist das simple past.
            kind: form
        solution: |
          It was a Saturday morning in July. Ellie walked through Millbrook Park. The sky was blue and the sun was warm on her face. Birds sang in the trees, and children laughed near the pond. Ellie smiled and walked slowly.
        hint: Die App bewertet deinen Text nicht. Prüfe ihn selbst anhand der Punkte.
  - type: section
    id: weiter
    title: Rückblick auf die Geschichtenwoche
    blocks:
      - type: text
        text: "Damit endet Mr Hills zweite Geschichtenwoche. Mit der Brille fragst du, wessen Sicht eine Geschichte hat. Mit der Farbe fragst du, wie sich ihr Ort anfühlt. Die story map und der Geschichtenberg helfen dir bei jeder Geschichte, die du liest oder schreibst."
