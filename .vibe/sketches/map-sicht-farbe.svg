  <text x="122" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Sophie, Ellie</text>
  <rect x="246" y="10" width="224" height="96" rx="6" fill="#c9d3df" stroke="#138d75" stroke-width="3"/>
  <rect x="246" y="10" width="224" height="28" rx="6" fill="#138d75"/>
  <text x="358" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">where</text>
  <text x="358" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">the park</text>
