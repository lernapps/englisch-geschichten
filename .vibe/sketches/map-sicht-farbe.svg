  <text x="358" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Ellie walks home</text>
  <g fill="none" stroke="#222" stroke-width="2.5"><circle cx="30" cy="52" r="7"/><circle cx="52" cy="52" r="7"/><line x1="37" y1="52" x2="45" y2="52"/></g>
