<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 222" role="img">
  <title>Skizze: Die story map (leer)</title>
  <rect width="480" height="222" fill="#f4efe2"/>
  <rect x="10" y="10" width="224" height="96" rx="6" fill="#fff" stroke="#2c6fd8" stroke-width="3"/>
  <rect x="10" y="10" width="224" height="28" rx="6" fill="#2c6fd8"/>
  <text x="122" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">who</text>
  <text x="122" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Wer kommt vor?</text>
  <rect x="246" y="10" width="224" height="96" rx="6" fill="#fff" stroke="#138d75" stroke-width="3"/>
  <rect x="246" y="10" width="224" height="28" rx="6" fill="#138d75"/>
  <text x="358" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">where</text>
  <text x="358" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Wo spielt es?</text>
  <rect x="10" y="116" width="224" height="96" rx="6" fill="#fff" stroke="#d35400" stroke-width="3"/>
  <rect x="10" y="116" width="224" height="28" rx="6" fill="#d35400"/>
  <text x="122" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">when</text>
  <text x="122" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Wann spielt es?</text>
  <rect x="246" y="116" width="224" height="96" rx="6" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <rect x="246" y="116" width="224" height="28" rx="6" fill="#c0392b"/>
  <text x="358" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">what</text>
  <text x="358" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Was passiert?</text>
</svg>
